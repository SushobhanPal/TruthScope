<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TruthScope — Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div class="ts-card" style="width:100%;max-width:420px;margin:24px;">

      <div style="text-align:center;margin-bottom:32px;">
        <div class="ts-logo-icon" style="margin:0 auto 16px;width:52px;height:52px;font-size:24px;">🔐</div>
        <h1 style="font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#fff 40%,var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Admin Panel</h1>
        <p style="color:var(--text-muted);font-size:0.875rem;margin-top:6px;">TruthScope Dashboard Access</p>
      </div>

      {% if error %}
      <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px 16px;margin-bottom:20px;color:#ef4444;font-size:0.875rem;">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <form method="POST">
        <div class="mb-3">
          <label class="ts-label">Username</label>
          <input type="text" name="username" class="ts-textarea" style="min-height:unset;padding:12px 16px;" placeholder="Enter username" required>
        </div>
        <div class="mb-4">
          <label class="ts-label">Password</label>
          <input type="password" name="password" class="ts-textarea" style="min-height:unset;padding:12px 16px;" placeholder="Enter password" required>
        </div>
        <button type="submit" class="ts-btn ts-btn-primary">🔓 Login to Dashboard</button>
      </form>

      <div style="text-align:center;margin-top:20px;">
        <a href="{{ url_for('home') }}" style="color:var(--text-muted);font-size:0.8rem;text-decoration:none;">← Back to TruthScope</a>
      </div>
    </div>
  </div>
</body>
</html>
