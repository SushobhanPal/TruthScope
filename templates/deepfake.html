<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TruthScope - Deepfake Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center g-4">

      <div class="col-md-6">
        <h1 class="text-center mb-4 fw-bold text-white">Deepfake Detector</h1>
        <a href="{{ url_for('home') }}" class="btn btn-outline-light mb-3">← Back to Text Analysis</a>

        <form method="POST" enctype="multipart/form-data" class="bg-transparent">
          <div class="mb-3">
            <label class="form-label fw-semibold text-white">Upload Image</label>
            <input type="file" name="image" accept="image/*" class="form-control form-control-lg shadow-sm" required>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-custom px-4 fw-semibold">Predict</button>
          </div>
        </form>
      </div>

      {% if prediction %}
      <div class="col-md-6">
        <div class="p-4 shadow-sm rounded-3 bg-white">
          <h4 class="fw-bold mb-3">Prediction Result</h4>
          {% if image_path %}
            <img src="{{ url_for('static', filename=image_path) }}" class="img-fluid rounded mb-3" alt="Uploaded Image">
          {% endif %}
          <p class="fs-5">Prediction: <strong class="{{ 'text-success' if prediction == 'Real' else 'text-danger' }}">{{ prediction }}</strong></p>
          <p class="fs-6 text-muted">Confidence: {{ confidence }}</p>
        </div>
      </div>
      {% endif %}

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
